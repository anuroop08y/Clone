<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Martel+Sans:wght@200;300;400;600;700;800;900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="main">
        <nav>
            <span><img width="10%" height="100%" src="assets/images/logo.svg" alt="Netflix Logo"></span>
            <div>
                <button class="btn" id="language-button">English</button>
                <button class="btn red" id="sign-in-button">Sign In</button>
            </div>
        </nav>
        <div class="container">

        </div>
        <div class="hero">
            <span> Enjoy big movies, TV shows and more.</span>
            <span>Join today and watch anywhere. Cancel anytime.</span>
            <span>Ready to watch? Enter your email to create or restart your membership.</span>
            <div class="email-form">
                <input type="email" placeholder="Email address">
                <button class="btn red" id="get-started">Get Started ></button>
            </div>
        </div>
        <div class="separation"></div>
    </div>
</body>

</html>
